openapi: 3.1.0
info:
  title: CompassStudio
  version: 0.0.0
  description: Draft. Not frozen until the spikes are done (docs/decisions.md section 6).
servers:
  - url: /api/v1
paths:
  /info:
    get:
      summary: API version, capabilities and supported schema versions
      responses:
        "200":
          description: Server information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
components:
  schemas:
    Info:
      type: object
      required: [api_version, capabilities, schemas]
      properties:
        api_version:
          type: string
        capabilities:
          type: array
          items:
            type: string
        schemas:
          type: object
          description: Binary schema name to list of supported versions
          additionalProperties:
            type: array
            items:
              type: string
