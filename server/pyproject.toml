[project]
name = "compass-studio-server"
version = "0.0.1"
description = "Local server for CompassStudio: tiles and annotation queries over COMPASS stores"
authors = [{name = "Vlad Popovici", email = "popovici@bioxlab.org"}]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "zarr>=3.0.8",
    "numcodecs>=0.15",
    "crc32c>=2.7",
    "shapely>=2.1.2,<3.0.0",
    "pyarrow>=18",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pillow>=11",
    "mapbox-earcut>=1.0",
]

[project.scripts]
compass-studio-synth = "compass_studio.synth.cli:main"
compass-studio-serve = "compass_studio.serve:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compass_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Supply-chain hygiene: resolve only releases at least ~two weeks old.
# Move the date forward deliberately when upgrading.
exclude-newer = "2026-10-29T00:00:00Z"
